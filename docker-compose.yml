version: "3.8"

services:
  mysql:
    image: mysql:5.7
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: devops
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - twotier

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  flask-app:
    image: shahzaibazeem/two-tier-flask-app:latest
    restart: always

    ports:
      - "5000:5000"

    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DB: devops

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - twotier

networks:
  twotier:

volumes:
  mysql-data: